# Netlify configuration for 정다빈 포트폴리오 + 방명록
#
# - publish: the static public folder produced by `npm run build`.
#   Only HTML/CSS/browser JS/images land here. .git, .kiro, .env, docs,
#   node_modules and the server functions are NOT inside dist/.
# - functions: server-side code (Supabase access with the service key).
#   This folder lives OUTSIDE the publish directory, so it is never served
#   as a static file.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Bundle serverless functions with esbuild. Without an explicit bundler the
# local `netlify dev` watcher can intermittently drop the function on Windows
# ("Removed function guestbook"), causing /api/guestbook to 404 even though the
# function itself works. esbuild also matches Netlify's production bundling.
[functions]
  node_bundler = "esbuild"

[build.environment]
  # Node 22+ 는 native WebSocket 을 제공한다. supabase-js 가 클라이언트 생성 시
  # WebSocket 을 요구하는데, Node 20 에는 없어서 배포 함수가
  # "native WebSocket not found" 로 500 을 반환했다. 22 로 올려 해결한다.
  NODE_VERSION = "22"

# Short, friendly path for the guestbook API that maps to the functions.
[[redirects]]
  from = "/api/guestbook"
  to = "/.netlify/functions/guestbook"
  status = 200

# SPA-style fallback is NOT used: this is a single static index.html site,
# so no catch-all redirect is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
