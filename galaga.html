<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갤러그 스타일 슈팅 게임 | 정다빈</title>
  <style>
    :root { --bg:#0a0f1c; --panel:#121b30; --line:#223050; --text:#e6ecf7; --muted:#8d9bb5; --mint:#4fe3c1; --gold:#e8c06a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; line-height:1.7; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:640px; margin:0 auto; padding:22px 18px 60px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .home-btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; font-weight:700; transition:border-color .2s, color .2s; }
    .home-btn:hover { border-color:var(--mint); color:var(--mint); }
    h1 { font-size:22px; margin:0; letter-spacing:-.5px; }
    h1 .dot { color:var(--mint); }
    .desc { color:var(--muted); font-size:14px; margin:0 0 20px; }
    #game-area { display:flex; flex-direction:column; align-items:center; }
    #game-area canvas { width:min(100%,480px); height:auto; aspect-ratio:3/4; border:2px solid var(--line); border-radius:10px; touch-action:none; box-shadow:0 0 40px rgba(79,227,193,.08); background:#000; }
    #game-area .pad { display:flex; gap:10px; margin-top:12px; width:min(100%,480px); }
    #game-area .pad button { flex:1; padding:16px 0; font-size:20px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; user-select:none; touch-action:none; cursor:pointer; }
    #game-area .pad button:hover { border-color:var(--mint); }
    .hint { color:var(--muted); font-size:13px; margin:12px 0 0; text-align:center; }
    #rank-panel { margin:22px auto 0; width:min(100%,480px); border:1px solid var(--mint); background:var(--panel); border-radius:14px; padding:18px 20px; }
    #rank-panel h2 { margin:0 0 4px; font-size:17px; color:var(--mint); }
    #rank-panel .big { color:var(--gold); font-size:26px; font-weight:800; }
    #rank-form { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    #rank-form input { flex:1; min-width:140px; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:#0e1526; color:var(--text); font-size:14px; font-family:inherit; }
    #rank-form input:focus-visible { outline:2px solid var(--mint); border-color:var(--mint); }
    #rank-form button { padding:11px 20px; border-radius:8px; border:1px solid var(--mint); background:var(--mint); color:#06241d; font-size:14px; font-weight:700; cursor:pointer; }
    #rank-form button:disabled { opacity:.55; cursor:not-allowed; }
    .rank-status { min-height:18px; font-size:13px; margin-top:10px; }
    .rank-status.ok { color:var(--mint); }
    .rank-status.err { color:#ff7a6a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="home-btn" href="index.html#project">← 홈으로</a>
    </div>
    <h1>🕹️ 갤러그 스타일 슈팅 게임<span class="dot">.</span></h1>
    <p class="desc">방향키로 이동하고 Space로 발사하세요. 적 편대를 모두 격추해 최고 점수에 도전하세요. 게임이 끝나면 점수를 등록할 수 있어요.</p>
    <div id="game-area">
      <canvas id="g" width="480" height="640"></canvas>
      <div class="pad">
        <button id="bl" aria-label="왼쪽">◀</button>
        <button id="bf" aria-label="발사">발사</button>
        <button id="br" aria-label="오른쪽">▶</button>
      </div>
      <p class="hint">← → 이동 · 스페이스 발사 · R 재시작 · 모바일은 버튼 터치</p>
    </div>
    <div id="rank-panel" hidden>
      <h2>🏆 점수 등록</h2>
      <div>이번 점수 <span class="big" id="rank-score">0</span>점</div>
      <form id="rank-form" autocomplete="off" novalidate>
        <input type="text" id="rank-nick" maxlength="10" placeholder="닉네임 (1~10자)" aria-label="닉네임">
        <button type="submit" id="rank-submit">점수 등록</button>
      </form>
      <p class="rank-status" id="rank-status" role="status" aria-live="polite"></p>
    </div>
  </div>
  <script>
  (function () {
    const cv = document.getElementById('g');
    if (!cv) return;
    const ctx = cv.getContext('2d'), W = 480, H = 640;
    let active = false; // 게임 영역에 포커스가 있을 때만 키 입력 처리
    let state = 'start', score = 0, hi = 0, stage = 1, lives = 3, keys = {}, bullets = [], eb = [], en = [], parts = [], pl, fx, fy, fdir, fspd, cool = 0, inv = 0, t = 0, banner = 0;
    try { hi = +localStorage.getItem('galagaHi') || 0 } catch (e) {}
    const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: .4 + Math.random() * 2 }));
    const COL = ['#ff5a7a', '#ffb23e', '#ffe45e', '#5ee6a8', '#5ec8ff'];
    const PTS = [50, 40, 30, 20, 10];

    function startStage() {
      pl = { x: W / 2, y: H - 50 }; bullets = []; eb = []; parts = []; en = [];
      fx = 70; fy = 70; fdir = 1; fspd = .6 + stage * .15; inv = 60; banner = 90;
      for (let r = 0; r < 5; r++) for (let c = 0; c < 8; c++) en.push({ r, c, alive: true, m: 0, x: 0, y: 0 });
    }
    function reset() { score = 0; stage = 1; lives = 3; startStage(); state = 'play'; if (window.onGameStart) window.onGameStart(); }
    const sx = e => fx + e.c * 48, sy = e => fy + e.r * 38;
    function boom(x, y, c) { for (let i = 0; i < 14; i++) { const a = Math.random() * 6.28, v = 1 + Math.random() * 3; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 30, c }); } }
    function over() { state = 'over'; if (score > hi) { hi = score; try { localStorage.setItem('galagaHi', hi) } catch (e) {} } if (window.onGameOver) window.onGameOver(score); }
    function hitPlayer() {
      if (inv > 0) return;
      lives--; boom(pl.x, pl.y, '#fff'); inv = 120;
      if (lives <= 0) over();
    }

    function update() {
      t++;
      for (const s of stars) { s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
      for (const p of parts) { p.x += p.vx; p.y += p.vy; p.l--; }
      parts = parts.filter(p => p.l > 0);
      if (state !== 'play') return;
      if (banner > 0) banner--;
      if (inv > 0) inv--;
      if (keys.ArrowLeft) pl.x -= 5;
      if (keys.ArrowRight) pl.x += 5;
      pl.x = Math.max(20, Math.min(W - 20, pl.x));
      if (cool > 0) cool--;
      if (keys.Space && cool === 0) { bullets.push({ x: pl.x, y: pl.y - 16 }); cool = 14; }

      fx += fdir * fspd;
      if (fx > 120 || fx < 24) { fdir *= -1; fx = Math.max(24, Math.min(120, fx)); fy += 14; fspd *= 1.03; }
      const alive = en.filter(e => e.alive);
      if (t % 100 === 0 && Math.random() < .5 + stage * .06) {
        const c = alive.filter(e => e.m === 0);
        if (c.length) { const e = c[Math.random() * c.length | 0]; e.m = 1; e.x = sx(e); e.y = sy(e); }
      }
      if (alive.length && Math.random() < .012 + stage * .003) {
        const e = alive[Math.random() * alive.length | 0];
        const ex = e.m === 0 ? sx(e) : e.x, ey = e.m === 0 ? sy(e) : e.y;
        if (ey > 0) eb.push({ x: ex, y: ey + 10 });
      }
      for (const e of alive) {
        if (e.m === 0) { e.x = sx(e); e.y = sy(e); }
        else if (e.m === 1) {
          e.y += 2 + stage * .15; e.x += Math.sin(e.y / 30) * 2 + (pl.x - e.x) * .008;
          if (e.y > H + 20) { e.y = -20; e.m = 2; }
        } else {
          const dx = sx(e) - e.x, dy = sy(e) - e.y, d = Math.hypot(dx, dy);
          if (d < 4) e.m = 0; else { e.x += dx / d * 3; e.y += dy / d * 3; }
        }
        if (e.m === 0 && e.y >= pl.y - 24) { over(); return; }
        if (inv === 0 && Math.abs(e.x - pl.x) < 20 && Math.abs(e.y - pl.y) < 18) { e.alive = false; boom(e.x, e.y, COL[e.r]); hitPlayer(); }
      }
      for (const b of bullets) b.y -= 9;
      bullets = bullets.filter(b => b.y > -10);
      for (const b of bullets) {
        for (const e of en) {
          if (e.alive && Math.abs(b.x - e.x) < 14 && Math.abs(b.y - e.y) < 12) {
            e.alive = false; b.y = -99; boom(e.x, e.y, COL[e.r]);
            score += PTS[e.r] * (e.m === 1 ? 2 : 1);
            break;
          }
        }
      }
      for (const b of eb) b.y += 3 + stage * .2;
      eb = eb.filter(b => b.y < H + 10);
      for (const b of eb) {
        if (inv === 0 && Math.abs(b.x - pl.x) < 14 && Math.abs(b.y - pl.y) < 14) { b.y = H + 99; hitPlayer(); }
      }
      if (state === 'play' && !en.some(e => e.alive)) { stage++; startStage(); }
    }

    function drawShip(x, y, c) {
      ctx.fillStyle = c; ctx.beginPath();
      ctx.moveTo(x, y - 16); ctx.lineTo(x + 14, y + 12); ctx.lineTo(x + 5, y + 7); ctx.lineTo(x - 5, y + 7); ctx.lineTo(x - 14, y + 12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 6, 4, 8);
    }
    function drawEnemy(e) {
      const c = COL[e.r], x = e.x, y = e.y, f = (t >> 4) & 1;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.ellipse(x, y, 10, 8, 0, 0, 6.28); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - 8, y - 2); ctx.lineTo(x - 16, y + (f ? -6 : 2)); ctx.lineTo(x - 6, y + 4); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 8, y - 2); ctx.lineTo(x + 16, y + (f ? -6 : 2)); ctx.lineTo(x + 6, y + 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillRect(x - 5, y - 3, 3, 3); ctx.fillRect(x + 2, y - 3, 3, 3);
    }
    function text(s, x, y, size, c, a) { ctx.fillStyle = c || '#fff'; ctx.font = `bold ${size}px system-ui,"Malgun Gothic",sans-serif`; ctx.textAlign = a || 'center'; ctx.fillText(s, x, y); }

    function draw() {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      for (const s of stars) { ctx.fillStyle = s.s > 1.8 ? '#fff' : '#6f7bb0'; ctx.fillRect(s.x, s.y, s.s > 1.8 ? 2 : 1, s.s > 1.8 ? 2 : 1); }
      if (state === 'start') {
        text('GALAGA', W / 2, 240, 56, '#5ec8ff');
        text('스타일 슈팅 게임', W / 2, 278, 20, '#e8ecff');
        drawShip(W / 2, 350, '#5ec8ff');
        if ((t >> 5) & 1) text('클릭 또는 화면 터치로 시작', W / 2, 430, 18, '#ffe45e');
        text('최고 점수 ' + hi, W / 2, 480, 16, '#7a86b8');
        return;
      }
      for (const e of en) if (e.alive) drawEnemy(e);
      for (const b of bullets) { ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 1.5, b.y - 8, 3, 12); }
      ctx.fillStyle = '#ff5a7a'; for (const b of eb) ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
      if (state === 'play' && !(inv > 0 && (t >> 2) & 1)) drawShip(pl.x, pl.y, '#5ec8ff');
      for (const p of parts) { ctx.globalAlpha = p.l / 30; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); }
      ctx.globalAlpha = 1;
      text('점수 ' + score, 12, 24, 16, '#fff', 'left');
      text('최고 ' + hi, W / 2, 24, 16, '#ffe45e');
      text('스테이지 ' + stage, W - 12, 24, 16, '#fff', 'right');
      for (let i = 0; i < lives; i++) drawShip(24 + i * 30, H - 18, '#5ec8ff');
      if (banner > 0 && state === 'play') text('스테이지 ' + stage, W / 2, H / 2, 32, '#ffe45e');
      if (state === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
        text('게임 오버', W / 2, 250, 44, '#ff5a7a');
        text('점수 ' + score, W / 2, 300, 24);
        text('최고 점수 ' + hi, W / 2, 334, 18, '#ffe45e');
        text('R 키 또는 화면 터치로 재시작', W / 2, 390, 18, '#e8ecff');
      }
    }
    function loop() { update(); draw(); requestAnimationFrame(loop); }

    // 게임 영역을 클릭/터치하면 활성화, 바깥을 누르면 비활성화
    const area = document.getElementById('game-area');
    document.addEventListener('pointerdown', e => { active = area.contains(e.target); });

    addEventListener('keydown', e => {
      if (!active) return;
      if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      keys[e.code === 'Space' ? 'Space' : e.code] = true;
      if (state === 'start' && (e.code === 'Enter' || e.code === 'Space')) reset();
      if (state === 'over' && (e.code === 'KeyR' || e.code === 'Enter')) reset();
    });
    addEventListener('keyup', e => { keys[e.code === 'Space' ? 'Space' : e.code] = false; });
    cv.addEventListener('pointerdown', () => { if (state !== 'play') reset(); });
    function hold(id, k) {
      const b = document.getElementById(id);
      const on = e => { e.preventDefault(); keys[k] = true; if (state !== 'play') reset(); };
      const off = e => { e.preventDefault(); keys[k] = false; };
      b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
      b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
    }
    hold('bl', 'ArrowLeft'); hold('br', 'ArrowRight'); hold('bf', 'Space');
    loop();
  })();
  </script>
  <script>
  // 점수 등록 (게임 오버 후) — Supabase scores 테이블에 INSERT. publishable anon 키만 사용.
  (function () {
    const GAME_ID = 'game-galaga';
    const MAX_SCORE = 9999999;
    const SUPA_URL = 'https://zphzpmbuvqiknqfuiitu.supabase.co';
    const SUPA_ANON = 'sb_publishable_DGc4vNTgEaWvTugqM-XPQQ_CRr9Qzwx';
    const HDRS = { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON };
    const REST = SUPA_URL + '/rest/v1/scores';
    const panel = document.getElementById('rank-panel');
    const form = document.getElementById('rank-form');
    const nick = document.getElementById('rank-nick');
    const scoreLabel = document.getElementById('rank-score');
    const submit = document.getElementById('rank-submit');
    const status = document.getElementById('rank-status');
    let pendingScore = null, submitted = false;
    function setStatus(text, kind) { status.textContent = text || ''; status.className = 'rank-status' + (kind ? ' ' + kind : ''); }
    window.onGameOver = function (finalScore) {
      pendingScore = Math.max(0, Math.min(MAX_SCORE, Math.floor(finalScore || 0)));
      submitted = false; scoreLabel.textContent = pendingScore; nick.value = '';
      submit.disabled = false; setStatus('', ''); panel.hidden = false;
    };
    window.onGameStart = function () { panel.hidden = true; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitted) return;
      const nv = nick.value.trim();
      if (nv.length < 1 || nv.length > 10) { setStatus('닉네임은 1~10자로 입력해 주세요.', 'err'); nick.focus(); return; }
      if (pendingScore == null) { setStatus('등록할 점수가 없어요.', 'err'); return; }
      submit.disabled = true; setStatus('등록 중…', '');
      try {
        const res = await fetch(REST, {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, HDRS),
          body: JSON.stringify({ game_id: GAME_ID, nickname: nv, score: pendingScore })
        });
        if (!res.ok) { setStatus('등록 실패. 잠시 후 다시 시도해 주세요.', 'err'); submit.disabled = false; return; }
        submitted = true; setStatus('등록 완료! 홈 랭킹에서 확인할 수 있어요.', 'ok');
      } catch (err) { setStatus('등록 실패. 네트워크를 확인해 주세요.', 'err'); submit.disabled = false; }
    });
  })();
  </script>
</body>
</html>
