<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두더지 잡기 | 정다빈</title>
  <style>
    :root { --bg:#0a0f1c; --panel:#121b30; --line:#223050; --text:#e6ecf7; --muted:#8d9bb5; --mint:#4fe3c1; --gold:#e8c06a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; line-height:1.7; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:640px; margin:0 auto; padding:22px 18px 60px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .home-btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14px; font-weight:700; transition:border-color .2s, color .2s; }
    .home-btn:hover { border-color:var(--mint); color:var(--mint); }
    h1 { font-size:22px; margin:0; letter-spacing:-.5px; }
    h1 .dot { color:var(--mint); }
    .desc { color:var(--muted); font-size:14px; margin:0 0 20px; }
    #mole-area { display:flex; flex-direction:column; align-items:center; }
    #mole-area canvas { width:min(100%,480px); height:auto; aspect-ratio:3/4; border:2px solid var(--line); border-radius:10px; touch-action:none; box-shadow:0 0 40px rgba(232,192,106,.08); cursor:none; }
    .hint { color:var(--muted); font-size:13px; margin:12px 0 0; text-align:center; }
    #rank-panel { margin:22px auto 0; width:min(100%,480px); border:1px solid var(--mint); background:var(--panel); border-radius:14px; padding:18px 20px; }
    #rank-panel h2 { margin:0 0 4px; font-size:17px; color:var(--mint); }
    #rank-panel .big { color:var(--gold); font-size:26px; font-weight:800; }
    #rank-form { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    #rank-form input { flex:1; min-width:140px; padding:11px 13px; border:1px solid var(--line); border-radius:8px; background:#0e1526; color:var(--text); font-size:14px; font-family:inherit; }
    #rank-form input:focus-visible { outline:2px solid var(--mint); border-color:var(--mint); }
    #rank-form button { padding:11px 20px; border-radius:8px; border:1px solid var(--mint); background:var(--mint); color:#06241d; font-size:14px; font-weight:700; cursor:pointer; }
    #rank-form button:disabled { opacity:.55; cursor:not-allowed; }
    .rank-status { min-height:18px; font-size:13px; margin-top:10px; }
    .rank-status.ok { color:var(--mint); }
    .rank-status.err { color:#ff7a6a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="home-btn" href="index.html#project">← 홈으로</a>
    </div>
    <h1>🔨 두더지 잡기<span class="dot">.</span></h1>
    <p class="desc">30초 안에 두더지를 최대한 많이 잡으세요. 두더지 +10점, 검은 폭탄 두더지 -20점. 게임이 끝나면 점수를 등록할 수 있어요.</p>
    <div id="mole-area">
      <canvas id="mg" width="480" height="640"></canvas>
      <p class="hint">두더지를 클릭하거나 터치해서 잡으세요. 검은 폭탄 두더지는 피하세요.</p>
    </div>
    <div id="rank-panel" hidden>
      <h2>🏆 점수 등록</h2>
      <div>이번 점수 <span class="big" id="rank-score">0</span>점</div>
      <form id="rank-form" autocomplete="off" novalidate>
        <input type="text" id="rank-nick" maxlength="10" placeholder="닉네임 (1~10자)" aria-label="닉네임">
        <button type="submit" id="rank-submit">점수 등록</button>
      </form>
      <p class="rank-status" id="rank-status" role="status" aria-live="polite"></p>
    </div>
  </div>
  <script>
  (function () {
    const cv = document.getElementById('mg');
    if (!cv) return;
    const ctx = cv.getContext('2d'), W = 480, H = 640;
    let activeMole = false;
    const HX = [90, 240, 390], HY = [250, 390, 530], HOLES = [];
    for (const y of HY) for (const x of HX) HOLES.push({ x, y });
    let state = 'start', score = 0, hi = 0, left = 30, moles = [], pops = [], mx = W / 2, my = H / 2, swing = 0, lastSpawn = 0, t0 = 0, tNow = 0;
    try { hi = +localStorage.getItem('moleHi') || 0 } catch (e) {}

    function start() { state = 'play'; score = 0; moles = []; pops = []; t0 = performance.now(); lastSpawn = 0; left = 30; if (window.onGameStart) window.onGameStart(); }
    function end() { state = 'over'; if (score > hi) { hi = score; try { localStorage.setItem('moleHi', hi) } catch (e) {} } if (window.onGameOver) window.onGameOver(score); }

    function spawn(el) {
      const max = 1 + Math.min(3, Math.floor(el / 8));
      if (moles.length >= max) return;
      const free = HOLES.map((_, i) => i).filter(i => !moles.some(m => m.h === i));
      if (!free.length) return;
      const bomb = Math.random() < Math.min(.25, .08 + el / 200);
      const life = Math.max(650, 1500 - el * 25);
      moles.push({ h: free[Math.random() * free.length | 0], born: tNow, life, bomb });
    }
    function vis(m) {
      const p = (tNow - m.born) / m.life;
      if (p < 0 || p > 1) return 0;
      return Math.min(1, Math.sin(p * Math.PI) * 1.6);
    }
    function update(now) {
      tNow = now;
      if (swing > 0) swing--;
      for (const p of pops) { p.y -= 1; p.l--; }
      pops = pops.filter(p => p.l > 0);
      if (state !== 'play') return;
      const el = (now - t0) / 1000;
      left = Math.max(0, 30 - el);
      if (left <= 0) { end(); return; }
      moles = moles.filter(m => now - m.born < m.life);
      const gap = Math.max(350, 900 - el * 18);
      if (now - lastSpawn > gap) { lastSpawn = now; spawn(el); }
    }

    function drawMole(m) {
      const h = HOLES[m.h], v = vis(m);
      if (v <= 0) return;
      ctx.save();
      ctx.beginPath(); ctx.rect(h.x - 60, h.y - 110, 120, 110); ctx.clip();
      const cy = h.y + 40 - v * 62;
      ctx.fillStyle = m.bomb ? '#2c2c34' : '#8a5a33';
      ctx.beginPath(); ctx.arc(h.x, cy, 34, 0, 6.28); ctx.fill();
      ctx.fillStyle = m.bomb ? '#ff4040' : '#fff';
      ctx.beginPath(); ctx.arc(h.x - 12, cy - 6, 7, 0, 6.28); ctx.arc(h.x + 12, cy - 6, 7, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(h.x - 12, cy - 6, 3, 0, 6.28); ctx.arc(h.x + 12, cy - 6, 3, 0, 6.28); ctx.fill();
      ctx.fillStyle = m.bomb ? '#555' : '#e8a0a0';
      ctx.beginPath(); ctx.ellipse(h.x, cy + 8, 9, 6, 0, 0, 6.28); ctx.fill();
      if (m.bomb) { ctx.strokeStyle = '#ffb23e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(h.x, cy - 34); ctx.lineTo(h.x + 8, cy - 46); ctx.stroke(); ctx.fillStyle = '#ff4040'; ctx.fillRect(h.x + 6, cy - 50, 6, 6); }
      ctx.restore();
    }
    function text(s, x, y, size, c, a) { ctx.fillStyle = c || '#fff'; ctx.font = `bold ${size}px system-ui,"Malgun Gothic",sans-serif`; ctx.textAlign = a || 'center'; ctx.fillText(s, x, y); }

    function drawHammer() {
      ctx.save(); ctx.translate(mx, my);
      ctx.rotate(swing > 0 ? -.2 : -.9);
      ctx.fillStyle = '#a8732f'; ctx.fillRect(-4, -10, 8, 56);
      ctx.fillStyle = '#6a6e78'; ctx.fillRect(-26, -34, 52, 28);
      ctx.fillStyle = '#8c909c'; ctx.fillRect(-26, -34, 52, 8);
      ctx.restore();
    }
    function draw() {
      ctx.fillStyle = '#3f7a35'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#386f2f'; for (let i = 0; i < 14; i++) ctx.fillRect((i * 97) % W, (i * 181) % H, 40, 6);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, 50);
      if (state === 'start') {
        text('두더지 잡기', W / 2, 230, 48, '#ffe45e');
        text('30초 안에 최대한 많이 잡으세요', W / 2, 275, 18, '#f3f0e0');
        text('두더지 +10 · 폭탄 두더지 -20', W / 2, 305, 16, '#cfe3b8');
        text('클릭 또는 터치로 시작', W / 2, 370, 22, '#fff');
        text('최고 점수 ' + hi, W / 2, 410, 16, '#cfe3b8');
        drawHammer(); return;
      }
      for (let i = 0; i < HOLES.length; i++) {
        const h = HOLES[i];
        ctx.fillStyle = '#1a120a'; ctx.beginPath(); ctx.ellipse(h.x, h.y, 52, 18, 0, 0, 6.28); ctx.fill();
        for (const m of moles) if (m.h === i) drawMole(m);
        ctx.fillStyle = '#5a3b1e'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 4, 56, 14, 0, 0, 3.14); ctx.fill();
      }
      text('점수 ' + score, 14, 32, 22, '#fff', 'left');
      text('시간 ' + Math.ceil(left), W - 14, 32, 22, left <= 5 ? '#ff8a7a' : '#fff', 'right');
      for (const p of pops) { ctx.globalAlpha = p.l / 40; text(p.s, p.x, p.y, 26, p.c); ctx.globalAlpha = 1; }
      if (state === 'over') {
        ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);
        text('시간 종료', W / 2, 240, 44, '#ffe45e');
        text('점수 ' + score, W / 2, 300, 28);
        text('최고 점수 ' + hi, W / 2, 338, 18, '#cfe3b8');
        ctx.fillStyle = '#ffe45e'; ctx.fillRect(W / 2 - 90, 380, 180, 52);
        text('다시 하기', W / 2, 414, 22, '#2a1b08');
      }
      drawHammer();
    }
    function loop(now) { update(now); draw(); requestAnimationFrame(loop); }

    function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
    cv.addEventListener('pointermove', e => { [mx, my] = pos(e); });
    cv.addEventListener('pointerdown', e => {
      activeMole = true;
      [mx, my] = pos(e); swing = 8;
      if (state !== 'play') {
        if (state === 'start' || (mx > W / 2 - 90 && mx < W / 2 + 90 && my > 380 && my < 432)) start();
        return;
      }
      for (let i = moles.length - 1; i >= 0; i--) {
        const m = moles[i], h = HOLES[m.h];
        if (vis(m) > .3 && Math.hypot(mx - h.x, my - (h.y - 22)) < 42) {
          const d = m.bomb ? -20 : 10; score += d;
          pops.push({ x: h.x, y: h.y - 70, l: 40, s: (d > 0 ? '+' : '') + d, c: d > 0 ? '#ffe45e' : '#ff6a5a' });
          moles.splice(i, 1); break;
        }
      }
    });
    document.addEventListener('pointerdown', e => { if (!cv.contains(e.target)) activeMole = false; });
    addEventListener('keydown', e => { if (activeMole && state !== 'play' && (e.code === 'Enter' || e.code === 'Space')) start(); });
    requestAnimationFrame(loop);
  })();
  </script>
  <script>
  // 점수 등록 (게임 오버 후) — Supabase scores 테이블에 INSERT. publishable anon 키만 사용.
  (function () {
    const GAME_ID = 'game-mole';
    const MAX_SCORE = 9999999;
    const SUPA_URL = 'https://zphzpmbuvqiknqfuiitu.supabase.co';
    const SUPA_ANON = 'sb_publishable_DGc4vNTgEaWvTugqM-XPQQ_CRr9Qzwx';
    const HDRS = { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON };
    const REST = SUPA_URL + '/rest/v1/scores';
    const panel = document.getElementById('rank-panel');
    const form = document.getElementById('rank-form');
    const nick = document.getElementById('rank-nick');
    const scoreLabel = document.getElementById('rank-score');
    const submit = document.getElementById('rank-submit');
    const status = document.getElementById('rank-status');
    let pendingScore = null, submitted = false;
    function setStatus(text, kind) { status.textContent = text || ''; status.className = 'rank-status' + (kind ? ' ' + kind : ''); }
    window.onGameOver = function (finalScore) {
      pendingScore = Math.max(0, Math.min(MAX_SCORE, Math.floor(finalScore || 0)));
      submitted = false; scoreLabel.textContent = pendingScore; nick.value = '';
      submit.disabled = false; setStatus('', ''); panel.hidden = false;
    };
    window.onGameStart = function () { panel.hidden = true; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitted) return;
      const nv = nick.value.trim();
      if (nv.length < 1 || nv.length > 10) { setStatus('닉네임은 1~10자로 입력해 주세요.', 'err'); nick.focus(); return; }
      if (pendingScore == null) { setStatus('등록할 점수가 없어요.', 'err'); return; }
      submit.disabled = true; setStatus('등록 중…', '');
      try {
        const res = await fetch(REST, {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, HDRS),
          body: JSON.stringify({ game_id: GAME_ID, nickname: nv, score: pendingScore })
        });
        if (!res.ok) { setStatus('등록 실패. 잠시 후 다시 시도해 주세요.', 'err'); submit.disabled = false; return; }
        submitted = true; setStatus('등록 완료! 홈 랭킹에서 확인할 수 있어요.', 'ok');
      } catch (err) { setStatus('등록 실패. 네트워크를 확인해 주세요.', 'err'); submit.disabled = false; }
    });
  })();
  </script>
</body>
</html>
